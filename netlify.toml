# Identify by Impausa — el test autoadministrable, como sitio estático.
#
# La web NO se versiona: se construye aquí. `test-identify.html` está en el
# .gitignore a propósito, porque es una salida del generador; si además se
# subiera al repositorio, tarde o temprano el fichero publicado y las fuentes
# dirían cosas distintas. Netlify lo genera en cada despliegue desde
# src/config, src/i18n y src/services, que son la única fuente.
#
# Se publica una carpeta que solo contiene la página. Ni el código, ni la
# documentación, ni datos/: lo que no está en `publico/` no se sirve, y por eso
# no hacen falta reglas para esconderlo.

[build]
  command = "node tools/render-test.mjs publico/index.html"
  publish = "publico"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# La redacción va en segundo plano: Netlify corta una función normal al minuto
# y escribir el informe tarda más. Contesta 202 al instante y deja el resultado
# en Blobs; la página lo recoge en /api/resultado.
[[redirects]]
  from = "/api/redactar"
  to = "/.netlify/functions/redactar-background"
  status = 200

[[redirects]]
  from = "/api/resultado"
  to = "/.netlify/functions/resultado"
  status = 200

# Retirar el informe. Lo pide quien lo tiene delante, con el mismo código con el
# que lo abre: es su material y no debería tener que pedirlo por correo.
[[redirects]]
  from = "/api/olvidar"
  to = "/.netlify/functions/olvidar"
  status = 200

# La limpieza NO lleva redirección: no es una dirección que nadie pueda visitar.
# La dispara el programador de Netlify una vez al día (netlify/functions/limpieza.mjs).

[build.environment]
  # Fijar la versión de Node: sin esto, un cambio del valor por defecto de
  # Netlify puede romper el build sin que nadie haya tocado nada. Hace falta
  # 22.6 o más para que Node ejecute los .ts directamente, que es de lo que
  # vive este proyecto.
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Quién puede meter la aplicación dentro de un iframe: ella misma y la web
    # de la casa, impausa.com con sus subdominios. Nadie más. Antes iba
    # `X-Frame-Options: DENY`, que lo prohibía todo y no sabe hacer excepciones
    # —su variante ALLOW-FROM no la respeta ningún navegador actual—; la forma
    # de decir «solo estos» es frame-ancestors. No se abre a todo el mundo a
    # propósito: una página ajena podría enmarcar el test y hacer pasar por suyo
    # un cuestionario donde la gente deja su nombre y sus respuestas.
    Content-Security-Policy = "frame-ancestors 'self' https://impausa.com https://*.impausa.com"
